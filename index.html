    <style>html.sw-boot { background: #0a0a0a; } html.sw-boot body { opacity: 0 !important; }</style>
    <script>
      // The swarm intro plays on the first visit (and again after a week, or with ?intro in the URL).
      // Hide the finished page until the swarm starts building it, so it never flashes first.
      window.__swarmIntro = (function () {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false
        if (/[?&]intro\b/.test(location.search)) return true
        try {
          var seen = +localStorage.getItem('sw-intro-seen') || 0
          return Date.now() - seen > 7 * 24 * 3600 * 1000
        } catch (e) { return true }
      })()
      if (window.__swarmIntro) {
        document.documentElement.classList.add('sw-boot')
        setTimeout(function () { document.documentElement.classList.remove('sw-boot') }, 4000)
      }
    </script>
    <script src="/swarm.js" defer></script>
